apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gke
  namespace: default
  labels:
    app: hello-gke
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-gke
  template:
    metadata:
      labels:
        app: hello-gke
        version: v1
    spec:
      containers:
      - name: hello-gke
        image: gcr.io/gcp-poc-496714/hello-gke:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_CONFIG_LOCATION
          value: "file:/etc/config/application.properties"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: hello-gke-config
      serviceAccountName: hello-gke-sa
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-gke
  namespace: default
  labels:
    app: hello-gke
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: hello-gke
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-gke-config
  namespace: default
data:
  application.properties: |
    spring.application.name=hello-gke
    server.port=8080
    server.servlet.context-path=/
    logging.level.root=INFO
    logging.level.com.example=DEBUG

    # Application properties
    app.message=hello gke
    app.version=1.0.0
    app.environment=gke

    # Actuator properties
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    management.health.probes.enabled=true
    server.tomcat.threads.max=200
    server.tomcat.threads.min-spare=10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-gke-sa
  namespace: default
