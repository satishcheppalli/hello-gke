# Production environment values

global:
  projectId: "your-prod-project-id"
  region: "us-central1"
  zone: "us-central1-a"

app:
  replicaCount: 5
  properties:
    logLevel: "WARN"
    logLevelApp: "INFO"

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1024Mi"
    cpu: "500m"

service:
  type: LoadBalancer
  annotations:
    cloud.google.com/load-balancer-type: "External"

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

image:
  tag: "latest"
  pullPolicy: Always

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Affinity for pod distribution
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - hello-gke
          topologyKey: kubernetes.io/hostname
