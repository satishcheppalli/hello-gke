# Development environment values

global:
  projectId: "your-dev-project-id"
  region: "us-central1"
  zone: "us-central1-a"

app:
  replicaCount: 1
  properties:
    logLevel: "DEBUG"
    logLevelApp: "DEBUG"

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

service:
  type: ClusterIP

autoscaling:
  enabled: false

image:
  tag: "latest"
  pullPolicy: Always
